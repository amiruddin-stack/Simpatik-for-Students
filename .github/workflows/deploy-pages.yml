name: Deploy SIMPATIK for Students to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: student-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main app
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install main dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000
      - name: Build main student app
        run: npm run build
      - name: Add main SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: fix/exam-internal-pwa-fullscreen
          path: preview-src
      - name: Prepare preview base path
        run: |
          sed -i "s|'/Simpatik-for-Students/'|'/Simpatik-for-Students/preview/'|" preview-src/vite.config.ts
      - name: Install preview dependencies
        working-directory: preview-src
        run: npm install --legacy-peer-deps --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000
      - name: Build preview app
        working-directory: preview-src
        run: npm run build
      - name: Add preview under /preview/
        run: |
          mkdir -p dist/preview
          cp -R preview-src/dist/. dist/preview/
          cp dist/preview/index.html dist/preview/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
