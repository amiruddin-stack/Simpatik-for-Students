name: Deploy SIMPATIK visual preview

on:
  push:
    branches: [login-blue-glossy-20261120]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: student-pages-visual-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current production app
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install production dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000
      - name: Build unchanged production app
        run: npm run build
      - name: Add production SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Checkout login design branch
        uses: actions/checkout@v4
        with:
          ref: login-blue-glossy-20261120
          path: preview-src
      - name: Set visual preview base path
        working-directory: preview-src
        run: sed -i "s|'/Simpatik-for-Students/'|'/Simpatik-for-Students/preview-login/'|" vite.config.ts
      - name: Install preview dependencies
        working-directory: preview-src
        run: npm install --legacy-peer-deps --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000
      - name: Build login design preview
        working-directory: preview-src
        run: npm run build
      - name: Add preview under /preview-login/
        run: |
          mkdir -p dist/preview-login
          cp -R preview-src/dist/. dist/preview-login/
          cp dist/preview-login/index.html dist/preview-login/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy visual preview without changing main source
        id: deployment
        uses: actions/deploy-pages@v4
